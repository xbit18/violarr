name: Publish Docker image

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.1.3
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  PRIMARY_IMAGE_NAME: xbit18/violarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"

          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.PRIMARY_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release-tag.outputs.tag }}
            type=raw,value=latest

      - name: Escape Docker metadata for retry wrapper
        id: meta_patched
        shell: bash
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          python3 - <<'PY'
          import os

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("tags=" + os.environ["META_TAGS"].replace("\n", "\\n") + "\n")
              output.write("labels=" + os.environ["META_LABELS"].replace("\n", "\\n") + "\n")
          PY

      - name: Build and push image
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/build-push-action@v6
          attempt_limit: 3
          attempt_delay: 15000
          steps_context: ${{ toJSON(steps) }}
          with: |
            context: .
            platforms: linux/amd64,linux/arm64
            push: true
            tags: "${{ steps.meta_patched.outputs.tags }}"
            labels: "${{ steps.meta_patched.outputs.labels }}"
            cache-from: type=gha
            cache-to: type=gha,mode=max