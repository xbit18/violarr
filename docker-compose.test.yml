name: violarr-integration-test

services:
  violarr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - violarr-test-data:/data
    environment:
      TZ: Europe/Rome
    restart: "no"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    ports:
      - "127.0.0.1:19696:9696"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome
    volumes:
      - prowlarr-test-config:/config
    restart: "no"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    ports:
      - "127.0.0.1:18989:8989"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome
    volumes:
      - sonarr-test-config:/config
      - sonarr-test-media:/tv
    restart: "no"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - "127.0.0.1:17878:7878"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome
    volumes:
      - radarr-test-config:/config
      - radarr-test-media:/movies
    restart: "no"

volumes:
  violarr-test-data:
  prowlarr-test-config:
  sonarr-test-config:
  sonarr-test-media:
  radarr-test-config:
  radarr-test-media:
